<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Join the game · Flying Tire Games</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, system-ui, sans-serif;
    background: #1b1530; color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  h1 { font-size: 26px; margin: 0 0 20px; text-align: center; }
  .screen { width: 100%; max-width: 420px; display: none; flex-direction: column; gap: 14px; }
  .screen.on { display: flex; }
  input {
    width: 100%; font-size: 22px; padding: 14px; border-radius: 12px; border: none;
    text-align: center; text-transform: uppercase;
  }
  #name { text-transform: none; }
  button {
    width: 100%; font-size: 22px; font-weight: 700; padding: 18px; border-radius: 14px;
    border: none; background: #ffb627; color: #1b1530;
  }
  button:active { transform: scale(0.97); }
  .answers { display: flex; flex-direction: column; gap: 12px; }
  .answers button { background: #fff; text-align: left; }
  .answers button.picked { background: #ffb627; }
  #lockBtn { background: #7dffa0; display: none; }
  .hint { font-size: 15px; opacity: 0.75; text-align: center; }
  .msg { font-size: 20px; text-align: center; line-height: 1.4; }
  .error { color: #ff8a8a; font-size: 16px; text-align: center; min-height: 20px; }
  .timer { display: block; width: 100%; height: 14px; min-height: 14px; flex-shrink: 0;
           border-radius: 7px; background: rgba(255,255,255,0.25); overflow: hidden; }
  .timer div { display: block; height: 14px; width: 100%; background: #ffb627; }
  .seconds { font-size: 40px; font-weight: 800; text-align: center; color: #ffb627; }
  .result-right { color: #7dffa0; font-size: 34px; font-weight: 800; text-align: center; }
  .result-wrong { color: #ff8a8a; font-size: 34px; font-weight: 800; text-align: center; }
  .points { font-size: 22px; text-align: center; }
</style>
</head>
<body>

<div id="join" class="screen on">
  <h1>Join the game</h1>
  <input id="code" placeholder="ROOM CODE" maxlength="4" autocomplete="off" autocapitalize="characters">
  <input id="name" placeholder="Your name" maxlength="16" autocomplete="off">
  <button id="joinBtn">Join</button>
  <div id="joinError" class="error"></div>
</div>

<div id="waiting" class="screen">
  <div class="msg" id="waitMsg">You're in!<br>Watch the big screen.</div>
</div>

<div id="question" class="screen">
  <div class="seconds" id="secondsLeft"></div>
  <div class="timer"><div id="timerBar"></div></div>
  <div class="msg" id="qText"></div>
  <div class="hint" id="qHint"></div>
  <div class="answers" id="answers"></div>
  <button id="lockBtn">Lock In</button>
</div>

<div id="result" class="screen">
  <div id="resultText"></div>
  <div class="points" id="pointsText"></div>
  <div class="msg">Watch the big screen.</div>
</div>

<script>
  const RELAY = "wss://herb-trivia-relay.flyingtiregames.workers.dev";
  const LETTERS = ["A", "B", "C", "D", "E", "F"];

  let socket = null;
  let myCode = "";
  let myName = "";
  let reconnectTries = 0;

  // Current question state
  let currentQid = null;
  let picks = [];          // option indexes this player picked
  let lockedIn = false;
  let timerHandle = null;

  function pid() {
    let id = null;
    try { id = localStorage.getItem("ftg_pid"); } catch (e) {}
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
      try { localStorage.setItem("ftg_pid", id); } catch (e) {}
    }
    return id;
  }
  const myId = pid();

  function show(id) {
    document.querySelectorAll("body > .screen").forEach(s => s.classList.remove("on"));
    document.getElementById(id).classList.add("on");
  }

  function waitScreen(html) {
    document.getElementById("waitMsg").innerHTML = html;
    show("waiting");
  }

  function send(obj) {
    if (socket && socket.readyState === 1) socket.send(JSON.stringify(obj));
  }

  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  function startTimer(seconds) {
    stopTimer();
    const bar = document.getElementById("timerBar");
    const label = document.getElementById("secondsLeft");
    const endAt = Date.now() + seconds * 1000;
    bar.style.width = "100%";
    label.textContent = seconds;
    timerHandle = setInterval(() => {
      const left = Math.max(0, endAt - Date.now());
      bar.style.width = (left / (seconds * 1000) * 100) + "%";
      label.textContent = Math.ceil(left / 1000);
      if (left <= 0) {
        stopTimer();
        if (!lockedIn) waitScreen("Time's up!<br>Watch the big screen.");
      }
    }, 100);
  }

  function lockIn() {
    if (lockedIn || picks.length === 0) return;
    lockedIn = true;
    // "choice" is kept for the old host test screen
    send({ type: "answer", qid: currentQid, picks: picks, choice: picks[0] });
    setTimeout(() => waitScreen("Locked in!<br>Waiting for everyone else."), 300);
  }

  function showQuestion(msg) {
    currentQid = msg.qid;
    picks = [];
    lockedIn = false;

    const multi = msg.qtype === "multi";
    document.getElementById("qText").textContent = msg.text || "";
    document.getElementById("qHint").textContent =
      multi ? "Pick ALL the right answers, then Lock In" : "";

    const box = document.getElementById("answers");
    box.innerHTML = "";
    msg.options.forEach((option, i) => {
      const b = document.createElement("button");
      b.textContent = (msg.qtype === "truefalse" ? "" : LETTERS[i] + ".  ") + option;
      b.onclick = () => {
        if (lockedIn) return;
        if (multi) {
          if (picks.includes(i)) {
            picks = picks.filter(p => p !== i);
            b.classList.remove("picked");
          } else {
            picks.push(i);
            b.classList.add("picked");
          }
        } else {
          picks = [i];
          b.classList.add("picked");
          lockIn();
        }
      };
      box.appendChild(b);
    });

    document.getElementById("lockBtn").style.display = multi ? "block" : "none";
    show("question");
    startTimer(msg.seconds || 20);
  }

  function showReveal(msg) {
    stopTimer();
    const correct = Array.isArray(msg.correct) ? msg.correct : [msg.correct];
    const right = lockedIn &&
      picks.length === correct.length && correct.every(c => picks.includes(c));
    const r = document.getElementById("resultText");
    if (right) {
      r.className = "result-right"; r.textContent = "Correct!";
    } else {
      r.className = "result-wrong"; r.textContent = lockedIn ? "Wrong!" : "Too slow!";
    }
    document.getElementById("pointsText").textContent = "";
    show("result");
  }

  function connect() {
    const url = RELAY + "/play?code=" + encodeURIComponent(myCode) +
                "&name=" + encodeURIComponent(myName) + "&pid=" + encodeURIComponent(myId);
    socket = new WebSocket(url);

    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "welcome") {
        reconnectTries = 0;
        waitScreen("You're in!<br>Watch the big screen.");
      }
      if (msg.type === "error") {
        stopTimer();
        document.getElementById("joinError").textContent = msg.message;
        show("join");
      }
      if (msg.type === "wait") {
        stopTimer();
        waitScreen(msg.text || "Watch the big screen.");
      }
      if (msg.type === "question") showQuestion(msg);
      if (msg.type === "reveal") showReveal(msg);
      if (msg.type === "score") {
        // Sent privately to this phone after a reveal
        document.getElementById("pointsText").textContent =
          (msg.points > 0 ? "+" + msg.points + " points · " : "") + "Total: " + msg.total;
      }
    };

    socket.onclose = (event) => {
      // 4000 = replaced, 4001 = host left, 4004 = room not found: don't retry
      if ([4000, 4001, 4004].includes(event.code)) return;
      if (reconnectTries < 5) {
        reconnectTries++;
        setTimeout(connect, 2000);
      } else {
        stopTimer();
        document.getElementById("joinError").textContent = "Lost connection. Try joining again.";
        show("join");
      }
    };
  }

  document.getElementById("lockBtn").onclick = lockIn;

  document.getElementById("joinBtn").onclick = () => {
    myCode = document.getElementById("code").value.trim().toUpperCase();
    myName = document.getElementById("name").value.trim();
    document.getElementById("joinError").textContent = "";
    if (!/^[A-Z]{4}$/.test(myCode)) {
      document.getElementById("joinError").textContent = "Room codes are 4 letters.";
      return;
    }
    if (!myName) {
      document.getElementById("joinError").textContent = "Type your name.";
      return;
    }
    reconnectTries = 0;
    connect();
  };

  // A link like flyingtiregames.com/play/?code=ABCD fills in the code
  const preset = new URLSearchParams(location.search).get("code");
  if (preset) document.getElementById("code").value = preset.toUpperCase();
</script>
</body>
</html>
