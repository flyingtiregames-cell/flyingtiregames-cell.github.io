<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Join the game · Flying Tire Games</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, system-ui, sans-serif;
    background: #1b1530; color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  h1 { font-size: 26px; margin: 0 0 20px; text-align: center; }
  .screen { width: 100%; max-width: 420px; display: none; flex-direction: column; gap: 14px; }
  .screen.on { display: flex; }
  input {
    width: 100%; font-size: 22px; padding: 14px; border-radius: 12px; border: none;
    text-align: center; text-transform: uppercase;
  }
  #name { text-transform: none; }
  button {
    width: 100%; font-size: 22px; font-weight: 700; padding: 18px; border-radius: 14px;
    border: none; background: #ffb627; color: #1b1530;
  }
  button:active { transform: scale(0.97); }
  .answers { display: flex; flex-direction: column; gap: 12px; }
  .answers button { background: #fff; text-align: left; }
  .answers button.picked { background: #ffb627; }
  #lockBtn { background: #7dffa0; display: none; }
  .hint { font-size: 15px; opacity: 0.75; text-align: center; }
  .msg { font-size: 20px; text-align: center; line-height: 1.4; }
  .error { color: #ff8a8a; font-size: 16px; text-align: center; min-height: 20px; }
  .timer { display: block; width: 100%; height: 14px; min-height: 14px; flex-shrink: 0;
           border-radius: 7px; background: rgba(255,255,255,0.25); overflow: hidden; }
  .timer div { display: block; height: 14px; width: 100%; background: #ffb627; }
  .seconds { font-size: 40px; font-weight: 800; text-align: center; color: #ffb627; }
  .result-right { color: #7dffa0; font-size: 34px; font-weight: 800; text-align: center; }
  .result-wrong { color: #ff8a8a; font-size: 34px; font-weight: 800; text-align: center; }
  .points { font-size: 22px; text-align: center; }
  .meter { position: relative; width: 100%; height: 70px; border-radius: 14px;
           background: rgba(255,255,255,0.15); overflow: hidden; }
  .meter .zone { position: absolute; top: 0; bottom: 0; background: #7dffa0; opacity: 0.85; }
  .meter .needle { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px;
                   background: #ffb627; box-shadow: 0 0 10px #ffb627; }
  #stopBtn { font-size: 34px; padding: 28px; background: #ff5a5a; color: #fff; }
  .bases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .bases button { font-size: 30px; padding: 22px 0; background: #fff; }
  .bases button.picked { background: #ffb627; }
  .orbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; justify-items: center; }
  .orbs button { background: none; padding: 0; width: 100%; max-width: 110px; border-radius: 50%; }
  .orbs button img { width: 100%; display: block; }
  .orbs button.flash { transform: scale(0.88); filter: brightness(1.4); }
  .orbTrail { display: flex; gap: 6px; justify-content: center; min-height: 40px; flex-wrap: wrap; }
  .orbTrail img { width: 36px; height: 36px; }
  .token { font-size: 30px; font-weight: 800; text-align: center; color: #ffd84d; line-height: 1.4; }
</style>
</head>
<body>

<div id="join" class="screen on">
  <h1>Join the game</h1>
  <input id="code" placeholder="ROOM CODE" maxlength="4" autocomplete="off" autocapitalize="characters">
  <input id="name" placeholder="Your name" maxlength="16" autocomplete="off">
  <button id="joinBtn">Join</button>
  <div id="joinError" class="error"></div>
</div>

<div id="waiting" class="screen">
  <div class="msg" id="waitMsg">You're in!<br>Watch the big screen.</div>
</div>

<div id="question" class="screen">
  <div class="seconds" id="secondsLeft"></div>
  <div class="timer"><div id="timerBar"></div></div>
  <div class="msg" id="qText"></div>
  <div class="hint" id="qHint"></div>
  <div class="answers" id="answers"></div>
  <button id="lockBtn">Lock In</button>
</div>

<div id="meterScreen" class="screen">
  <div class="msg">Stop the needle in the green zone!</div>
  <div class="seconds" id="meterSeconds"></div>
  <div class="meter"><div class="zone" id="meterZone"></div><div class="needle" id="meterNeedle"></div></div>
  <button id="stopBtn">STOP</button>
</div>

<div id="safeBaseScreen" class="screen">
  <div class="msg" id="sbTitle"></div>
  <div class="seconds" id="sbSeconds"></div>
  <div class="bases" id="sbBases"></div>
  <div class="hint">Pick one. You can't change it!</div>
</div>

<div id="orbScreen" class="screen">
  <div class="msg" id="omTitle"></div>
  <div class="seconds" id="omSeconds"></div>
  <div class="orbTrail" id="omTrail"></div>
  <div class="orbs" id="omOrbs"></div>
</div>

<div id="tokenScreen" class="screen">
  <div class="token">✨ You earned a secret token! ✨</div>
  <div class="msg" id="tokenCount"></div>
  <div class="hint">Keep it quiet. Use it in the final round.</div>
</div>

<div id="result" class="screen">
  <div id="resultText"></div>
  <div class="points" id="pointsText"></div>
  <div class="msg">Watch the big screen.</div>
</div>

<script>
  const RELAY = "wss://herb-trivia-relay.flyingtiregames.workers.dev";
  const LETTERS = ["A", "B", "C", "D", "E", "F"];

  let socket = null;
  let myCode = "";
  let myName = "";
  let reconnectTries = 0;

  // Current question state
  let currentQid = null;
  let picks = [];          // option indexes this player picked
  let lockedIn = false;
  let timerHandle = null;

  function pid() {
    let id = null;
    try { id = localStorage.getItem("ftg_pid"); } catch (e) {}
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
      try { localStorage.setItem("ftg_pid", id); } catch (e) {}
    }
    return id;
  }
  const myId = pid();

  function show(id) {
    document.querySelectorAll("body > .screen").forEach(s => s.classList.remove("on"));
    document.getElementById(id).classList.add("on");
  }

  function waitScreen(html) {
    document.getElementById("waitMsg").innerHTML = html;
    show("waiting");
  }

  function send(obj) {
    if (socket && socket.readyState === 1) socket.send(JSON.stringify(obj));
  }

  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  function startTimer(seconds) {
    stopTimer();
    const bar = document.getElementById("timerBar");
    const label = document.getElementById("secondsLeft");
    const endAt = Date.now() + seconds * 1000;
    bar.style.width = "100%";
    label.textContent = seconds;
    timerHandle = setInterval(() => {
      const left = Math.max(0, endAt - Date.now());
      bar.style.width = (left / (seconds * 1000) * 100) + "%";
      label.textContent = Math.ceil(left / 1000);
      if (left <= 0) {
        stopTimer();
        if (!lockedIn) waitScreen("Time's up!<br>Watch the big screen.");
      }
    }, 100);
  }

  function lockIn() {
    if (lockedIn || picks.length === 0) return;
    lockedIn = true;
    // "choice" is kept for the old host test screen
    send({ type: "answer", qid: currentQid, picks: picks, choice: picks[0] });
    setTimeout(() => waitScreen("Locked in!<br>Waiting for everyone else."), 300);
  }

  function showQuestion(msg) {
    currentQid = msg.qid;
    picks = [];
    lockedIn = false;

    const multi = msg.qtype === "multi";
    document.getElementById("qText").textContent = msg.text || "";
    document.getElementById("qHint").textContent =
      multi ? "Pick ALL the right answers, then Lock In" : "";

    const box = document.getElementById("answers");
    box.innerHTML = "";
    msg.options.forEach((option, i) => {
      const b = document.createElement("button");
      b.textContent = (msg.qtype === "truefalse" ? "" : LETTERS[i] + ".  ") + option;
      b.onclick = () => {
        if (lockedIn) return;
        if (multi) {
          if (picks.includes(i)) {
            picks = picks.filter(p => p !== i);
            b.classList.remove("picked");
          } else {
            picks.push(i);
            b.classList.add("picked");
          }
        } else {
          picks = [i];
          b.classList.add("picked");
          lockIn();
        }
      };
      box.appendChild(b);
    });

    document.getElementById("lockBtn").style.display = multi ? "block" : "none";
    show("question");
    startTimer(msg.seconds || 20);
  }

  function showReveal(msg) {
    stopTimer();
    const correct = Array.isArray(msg.correct) ? msg.correct : [msg.correct];
    const right = lockedIn &&
      picks.length === correct.length && correct.every(c => picks.includes(c));
    const r = document.getElementById("resultText");
    if (right) {
      r.className = "result-right"; r.textContent = "Correct!";
    } else {
      r.className = "result-wrong"; r.textContent = lockedIn ? "Wrong!" : "Too slow!";
    }
    document.getElementById("pointsText").textContent = "";
    show("result");
  }

  // ----- Mini-game: Stop the Meter -----
  // The needle runs on this phone and the phone measures where it stopped,
  // so internet speed doesn't affect the result.
  let meterAnim = null;
  let meterTimeout = null;
  let meterStopped = true;

  function stopMeterAnimation() {
    if (meterAnim) { cancelAnimationFrame(meterAnim); meterAnim = null; }
    if (meterTimeout) { clearInterval(meterTimeout); meterTimeout = null; }
  }

  function startMeter(msg) {
    stopMeterAnimation();
    stopTimer();
    meterStopped = false;

    const target = msg.target;
    const zone = msg.zone || 8;
    const zoneEl = document.getElementById("meterZone");
    zoneEl.style.left = (target - zone / 2) + "%";
    zoneEl.style.width = zone + "%";

    const needle = document.getElementById("meterNeedle");
    const period = 1400;                        // ms for one full sweep there and back
    const offset = Math.random() * period;      // each phone starts somewhere different
    const startedAt = performance.now();
    let position = 0;

    function frame(now) {
      const p = ((now - startedAt + offset) % period) / period;
      position = p < 0.5 ? p * 200 : (1 - p) * 200;   // 0 → 100 → 0
      needle.style.left = position + "%";
      meterAnim = requestAnimationFrame(frame);
    }
    meterAnim = requestAnimationFrame(frame);

    document.getElementById("stopBtn").onclick = () => {
      if (meterStopped) return;
      meterStopped = true;
      stopMeterAnimation();
      const distance = Math.abs(position - target);
      send({ type: "meter", distance: Math.round(distance * 100) / 100 });
      const accuracy = Math.max(0, Math.round(100 - distance));
      setTimeout(() => waitScreen("Stopped!<br>" + accuracy + "% accurate"), 500);
    };

    const seconds = msg.seconds || 15;
    const endAt = Date.now() + seconds * 1000;
    const label = document.getElementById("meterSeconds");
    label.textContent = seconds;
    meterTimeout = setInterval(() => {
      const left = Math.max(0, endAt - Date.now());
      label.textContent = Math.ceil(left / 1000);
      if (left <= 0 && !meterStopped) {
        meterStopped = true;
        stopMeterAnimation();
        waitScreen("Time's up!<br>Watch the big screen.");
      }
    }, 200);

    show("meterScreen");
  }

  // ----- Mini-game: Safe Base -----
  let sbTimer = null;

  function stopSafeBaseTimer() {
    if (sbTimer) { clearInterval(sbTimer); sbTimer = null; }
  }

  function startSafeBase(msg) {
    stopTimer();
    stopMeterAnimation();
    stopSafeBaseTimer();
    let picked = false;

    document.getElementById("sbTitle").innerHTML =
      "Round " + msg.round + ": pick a safe base!<br>" + msg.targets + " bases will be hit.";

    const box = document.getElementById("sbBases");
    box.innerHTML = "";
    for (let base = 1; base <= (msg.bases || 8); base++) {
      const b = document.createElement("button");
      b.textContent = base;
      b.onclick = () => {
        if (picked) return;
        picked = true;
        b.classList.add("picked");
        send({ type: "base", round: msg.round, base: base });
        stopSafeBaseTimer();
        setTimeout(() => waitScreen("Base " + base + " locked in!<br>Watch the big screen."), 400);
      };
      box.appendChild(b);
    }

    const seconds = msg.seconds || 10;
    const endAt = Date.now() + seconds * 1000;
    const label = document.getElementById("sbSeconds");
    label.textContent = seconds;
    sbTimer = setInterval(() => {
      const left = Math.max(0, endAt - Date.now());
      label.textContent = Math.ceil(left / 1000);
      if (left <= 0) {
        stopSafeBaseTimer();
        if (!picked) waitScreen("Time's up!<br>No base picked.");
      }
    }, 200);

    show("safeBaseScreen");
  }

  // ----- Mini-game: Orb Memory -----
  // Same order as the host app: index 0-4
  const ORBS = ["orb_fire", "orb_freeze", "orb_plant", "orb_rock", "orb_electric"];
  let omTimer = null;

  function stopOrbTimer() {
    if (omTimer) { clearInterval(omTimer); omTimer = null; }
  }

  function startOrbMemory(msg) {
    stopTimer();
    stopMeterAnimation();
    stopSafeBaseTimer();
    stopOrbTimer();

    const length = msg.length;
    let picks = [];
    let done = false;

    const title = document.getElementById("omTitle");
    const trail = document.getElementById("omTrail");
    title.textContent = "Repeat the " + length + " orbs!";
    trail.innerHTML = "";

    const box = document.getElementById("omOrbs");
    box.innerHTML = "";
    ORBS.forEach((name, i) => {
      const b = document.createElement("button");
      const img = document.createElement("img");
      img.src = "/play/orbs/" + name + ".png";
      img.alt = name;
      b.appendChild(img);
      b.onclick = () => {
        if (done) return;
        picks.push(i);
        b.classList.add("flash");
        setTimeout(() => b.classList.remove("flash"), 150);
        const t = document.createElement("img");
        t.src = "/play/orbs/" + name + ".png";
        trail.appendChild(t);
        title.textContent = picks.length + " of " + length;
        if (picks.length === length) {
          done = true;
          stopOrbTimer();
          send({ type: "orbs", round: msg.round, picks: picks });
          setTimeout(() => waitScreen("Locked in!<br>Watch the big screen."), 400);
        }
      };
      box.appendChild(b);
    });

    const seconds = msg.seconds || 10;
    const endAt = Date.now() + seconds * 1000;
    const label = document.getElementById("omSeconds");
    label.textContent = seconds;
    omTimer = setInterval(() => {
      const left = Math.max(0, endAt - Date.now());
      label.textContent = Math.ceil(left / 1000);
      if (left <= 0) {
        stopOrbTimer();
        if (!done) { done = true; waitScreen("Time's up!"); }
      }
    }, 200);

    show("orbScreen");
  }

  function connect() {
    const url = RELAY + "/play?code=" + encodeURIComponent(myCode) +
                "&name=" + encodeURIComponent(myName) + "&pid=" + encodeURIComponent(myId);
    socket = new WebSocket(url);

    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "welcome") {
        reconnectTries = 0;
        waitScreen("You're in!<br>Watch the big screen.");
      }
      if (msg.type === "error") {
        stopTimer();
        document.getElementById("joinError").textContent = msg.message;
        show("join");
      }
      if (msg.type === "wait") {
        stopTimer();
        stopMeterAnimation();
        stopSafeBaseTimer();
        stopOrbTimer();
        waitScreen(msg.text || "Watch the big screen.");
      }
      if (msg.type === "minigame" && msg.game === "meter") startMeter(msg);
      if (msg.type === "minigame" && msg.game === "safebase") startSafeBase(msg);
      if (msg.type === "minigame" && msg.game === "orbmemory") startOrbMemory(msg);
      if (msg.type === "orbmemory_result") {
        stopOrbTimer();
        waitScreen(msg.correct ? "✅ You got it!" : "💥 Wrong order!<br>You're out.");
      }
      if (msg.type === "safebase_result") {
        stopSafeBaseTimer();
        const hit = "Bases hit: " + msg.targets.join(", ");
        waitScreen(msg.safe ? "✅ Safe!<br>" + hit : "💥 You got hit!<br>You're out.<br>" + hit);
      }
      if (msg.type === "token") {
        stopMeterAnimation();
        document.getElementById("tokenCount").textContent =
          "You have " + msg.total + (msg.total === 1 ? " token." : " tokens.");
        show("tokenScreen");
      }
      if (msg.type === "question") showQuestion(msg);
      if (msg.type === "reveal") showReveal(msg);
      if (msg.type === "score") {
        // Sent privately to this phone after a reveal
        document.getElementById("pointsText").textContent =
          (msg.points > 0 ? "+" + msg.points + " points · " : "") + "Total: " + msg.total;
      }
    };

    socket.onclose = (event) => {
      // 4000 = replaced, 4001 = host left, 4004 = room not found: don't retry
      if ([4000, 4001, 4004].includes(event.code)) return;
      if (reconnectTries < 5) {
        reconnectTries++;
        setTimeout(connect, 2000);
      } else {
        stopTimer();
        document.getElementById("joinError").textContent = "Lost connection. Try joining again.";
        show("join");
      }
    };
  }

  document.getElementById("lockBtn").onclick = lockIn;

  document.getElementById("joinBtn").onclick = () => {
    myCode = document.getElementById("code").value.trim().toUpperCase();
    myName = document.getElementById("name").value.trim();
    document.getElementById("joinError").textContent = "";
    if (!/^[A-Z]{4}$/.test(myCode)) {
      document.getElementById("joinError").textContent = "Room codes are 4 letters.";
      return;
    }
    if (!myName) {
      document.getElementById("joinError").textContent = "Type your name.";
      return;
    }
    reconnectTries = 0;
    connect();
  };

  // A link like flyingtiregames.com/play/?code=ABCD fills in the code
  const preset = new URLSearchParams(location.search).get("code");
  if (preset) document.getElementById("code").value = preset.toUpperCase();
</script>
</body>
</html>
